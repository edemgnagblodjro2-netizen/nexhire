kind = "web"
previewPath = "/admin/"
title = "AttenteZéro — Panneau Admin"
version = "1.0.0"
id = "artifacts/admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 23744
serve = "static"

[services.development]
run = "pnpm --filter @workspace/admin run dev"

[services.env]
PORT = "23744"
BASE_PATH = "/admin/"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/admin", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/admin/"
