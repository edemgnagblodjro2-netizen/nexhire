services:
  - type: web
    name: nexhire
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /nexhire
      - key: BASE_URL
        value: https://nexhire.ca
      - key: DATABASE_URL
        fromDatabase:
          name: nexhire-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXHIRE_SESSION_SECRET
        generateValue: true

databases:
  - name: nexhire-db
    plan: free
