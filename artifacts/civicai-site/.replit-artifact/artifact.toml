kind = "web"
previewPath = "/"
title = "CivicAI — Site corporatif"
version = "1.0.0"
id = "artifacts/civicai-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23745

[services.development]
run = "pnpm --filter @workspace/civicai-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/civicai-site", "run", "build" ]
publicDir = "artifacts/civicai-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/services"
to = "/services.html"

[[services.production.rewrites]]
from = "/products"
to = "/products.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact.html"

[[services.production.rewrites]]
from = "/careers"
to = "/careers.html"

[[services.production.rewrites]]
from = "/blog"
to = "/blog.html"

[[services.production.rewrites]]
from = "/blog/*"
to = "/blog.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23745"
BASE_PATH = "/"
