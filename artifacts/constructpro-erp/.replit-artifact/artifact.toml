kind = "web"
previewPath = "/constructpro-erp/"
title = "ConstructPro ERP"
version = "1.0.0"
id = "artifacts/constructpro-erp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/constructpro-erp/" ]
localPort = 19381

[services.development]
run = "pnpm --filter @workspace/constructpro-erp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/constructpro-erp", "run", "build" ]
publicDir = "artifacts/constructpro-erp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19381"
BASE_PATH = "/constructpro-erp/"
