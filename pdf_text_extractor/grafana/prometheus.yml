global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: agenthub-platform
    env: production

scrape_configs:
  - job_name: agenthub
    scheme: https
    metrics_path: /metrics
    bearer_token: "${METRICS_TOKEN}"
    static_configs:
      - targets:
          - "${AGENTHUB_HOST}"
    tls_config:
      insecure_skip_verify: false
