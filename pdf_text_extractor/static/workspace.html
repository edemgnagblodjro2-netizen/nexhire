<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AgentHub Platform</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:    #2563eb;
      --primary-dk: #1d4ed8;
      --sidebar-w:  240px;
      --header-h:   64px;
      --text:       #111827;
      --muted:      #6b7280;
      --bg:         #f9fafb;
      --card:       #ffffff;
      --border:     #e5e7eb;
      --radius:     8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    #ws-header {
      height: var(--header-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    #ws-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    #ws-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      display: none;
      flex-shrink: 0;
    }

    #ws-header-titles {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    #ws-program-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    #ws-partner-name { color: var(--primary); }

    #ws-powered-by {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.2;
    }

    #ws-powered-by strong { font-weight: 600; color: #374151; }

    #ws-header-spacer { flex: 1; }

    #ws-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #ws-pilot-badge {
      font-size: 11px;
      font-weight: 600;
      background: #fef3c7;
      color: #92400e;
      border-radius: 4px;
      padding: 3px 8px;
      white-space: nowrap;
    }

    #ws-user-badge {
      font-size: 13px;
      color: var(--muted);
      display: none;
    }

    /* ── Layout ─────────────────────────────────────────── */
    #ws-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────── */
    #ws-sidebar {
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .ws-sidebar-section {
      padding: 16px 12px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .ws-app-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: calc(100% - 12px);
      padding: 9px 14px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: var(--radius);
      margin: 1px 6px;
      text-align: left;
      transition: background .15s;
      position: relative;
    }

    .ws-app-btn:hover:not(:disabled) { background: var(--bg); }

    .ws-app-btn.active {
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      color: var(--primary);
    }

    .ws-app-btn:disabled { cursor: default; opacity: .65; }

    .ws-app-icon { font-size: 18px; flex-shrink: 0; }

    .ws-app-label {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .ws-app-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ws-badge-soon {
      display: inline-block;
      font-size: 10px;
      background: #f3f4f6;
      color: var(--muted);
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .ws-badge-beta {
      display: inline-block;
      font-size: 10px;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── App container ──────────────────────────────────── */
    #ws-app-container {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }

    /* ── Home Dashboard ─────────────────────────────────── */
    .wsh-home {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 56px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .wsh-hero {
      background: linear-gradient(135deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 75%, #000) 100%);
      border-radius: 12px;
      padding: 28px 32px;
      color: #fff;
    }

    .wsh-hero-eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      opacity: .75;
      margin-bottom: 6px;
    }

    .wsh-hero-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .wsh-hero-sub { font-size: 13px; opacity: .7; }

    .wsh-progress-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
    }

    .wsh-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text);
    }

    .wsh-progress-header strong { font-weight: 700; color: var(--primary); }

    .wsh-progress-track {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .wsh-progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width .6s ease;
    }

    .wsh-progress-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .wsh-value-prop {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 20px 24px;
    }

    .wsh-vp-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .wsh-vp-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .wsh-vp-list li {
      font-size: 14px;
      color: #0369a1;
    }

    .wsh-vp-duration {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .wsh-apps-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 12px;
    }

    .wsh-app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .wsh-app-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      transition: border-color .15s, box-shadow .15s;
    }

    .wsh-app-card:not(.wsh-app-card-soon):hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 12%, transparent);
    }

    .wsh-app-card-soon { opacity: .65; }

    .wsh-app-card-icon { font-size: 28px; }

    .wsh-app-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .wsh-app-card-btn {
      width: 100%;
      padding: 9px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      text-align: center;
    }

    .wsh-app-card-btn:hover { opacity: .9; }

    .wsh-soon-badge {
      font-size: 11px;
      font-weight: 600;
      background: #f3f4f6;
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 10px;
    }

    /* CTA Pilote */
    .wsh-cta-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .wsh-cta-text { flex: 1; min-width: 180px; }
    .wsh-cta-text strong { font-size: 14px; display: block; margin-bottom: 3px; }
    .wsh-cta-text p { font-size: 13px; color: var(--muted); }

    .wsh-cta-btn {
      white-space: nowrap;
      padding: 10px 20px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    .wsh-cta-btn:hover { opacity: .9; }

    /* ── Loading / Error states ─────────────────────────── */
    .ws-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--muted);
      padding: 32px;
      text-align: center;
    }

    .ws-state-icon { font-size: 40px; }
    .ws-state-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .ws-state-msg   { font-size: 14px; max-width: 360px; line-height: 1.5; }

    .ws-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error banner ───────────────────────────────────── */
    #ws-error-banner {
      display: none;
      position: fixed;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      z-index: 100;
      max-width: 480px;
      text-align: center;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 640px) {
      :root { --sidebar-w: 60px; }
      .ws-app-name, .ws-badge-soon, .ws-badge-beta, .ws-sidebar-section { display: none; }
      .ws-app-btn { justify-content: center; padding: 10px; }
      .ws-app-icon { font-size: 22px; }
      .wsh-home { padding: 16px 12px 40px; gap: 14px; }
      .wsh-hero { padding: 20px; }
      .wsh-hero-title { font-size: 20px; }
      #ws-powered-by { display: none; }
      .wsh-app-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header id="ws-header">
    <div id="ws-header-left">
      <img id="ws-logo" alt="Logo partenaire" />
      <div id="ws-header-titles">
        <div id="ws-program-name">Accélérateur IA <span id="ws-partner-name"></span></div>
        <div id="ws-powered-by">Propulsé par <strong>AgentHub</strong></div>
      </div>
    </div>
    <span id="ws-header-spacer"></span>
    <div id="ws-header-right">
      <span id="ws-pilot-badge">Version pilote</span>
      <span id="ws-user-badge"></span>
    </div>
  </header>

  <div id="ws-body">
    <nav id="ws-sidebar">
      <div class="ws-sidebar-section">Applications</div>
      <div id="ws-app-list">
        <div class="ws-state" style="height:120px">
          <div class="ws-spinner"></div>
        </div>
      </div>
    </nav>

    <main id="ws-app-container">
      <div class="ws-state">
        <div class="ws-spinner"></div>
      </div>
    </main>
  </div>

  <div id="ws-error-banner"></div>

  <script type="module" src="/static/workspace.js"></script>
</body>
</html>
