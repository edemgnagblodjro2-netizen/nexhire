<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AgentHub Platform</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/design-system.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100dvh;
    }

    /* ── Topbar ─────────────────────────────────────────────────────── */
    #ws-topbar {
      height: var(--topbar-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px 0 0;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }

    #ws-topbar-brand {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-right: 1px solid var(--border);
      height: 100%;
    }

    #ws-logo {
      height: 28px;
      width: auto;
      object-fit: contain;
      display: none;
      flex-shrink: 0;
    }

    #ws-brand-text { min-width: 0; }

    #ws-program-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #ws-powered-by {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    #ws-topbar-center {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    #ws-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-2);
    }

    #ws-breadcrumb .bc-sep { color: var(--muted); }
    #ws-breadcrumb .bc-current { color: var(--text); font-weight: 600; }

    #ws-topbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .ws-icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      transition: background .12s;
    }
    .ws-icon-btn:hover { background: var(--bg); color: var(--text); }
    .ws-icon-btn svg { width: 18px; height: 18px; }

    #ws-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-lt);
      color: var(--primary-dk);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 4px;
      border: 2px solid transparent;
      transition: border-color .15s;
    }
    #ws-user-avatar:hover { border-color: var(--primary); }

    /* ── Layout ─────────────────────────────────────────────────────── */
    #ws-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    #ws-sidebar {
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    #ws-nav { flex: 1; overflow-y: auto; overflow-x: hidden; }

    .ws-nav-section {
      padding: 20px 12px 4px;
    }

    .ws-nav-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 0 8px;
      margin-bottom: 2px;
    }

    .ws-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      background: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
      transition: background .12s, color .12s, box-shadow .12s;
      color: var(--text-2);
      font-size: 13.5px;
      font-weight: 500;
      position: relative;
      box-shadow: inset 3px 0 0 transparent;
    }

    .ws-nav-item:hover:not(:disabled) {
      background: var(--bg);
      color: var(--text);
    }

    .ws-nav-item.active {
      background: var(--primary-a10);
      color: var(--primary);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .ws-nav-item.active .ws-nav-icon svg { stroke: var(--primary); }

    .ws-nav-item:disabled {
      cursor: default;
      opacity: .55;
    }

    .ws-nav-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ws-nav-icon svg { width: 16px; height: 16px; }

    .ws-nav-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ws-nav-badge {
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .ws-badge-soon {
      background: var(--bg-2);
      color: var(--muted);
    }

    .ws-badge-new {
      background: var(--color-ok-bg);
      color: var(--color-ok-text);
    }

    .ws-sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 16px;
    }

    /* ── Coming-soon compact grid ───────────────────────────────────── */
    .ws-coming-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px 4px 6px;
    }

    .ws-coming-btn {
      height: 32px;
      border: none;
      background: none;
      border-radius: var(--r-sm);
      cursor: not-allowed;
      opacity: .28;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .12s;
    }
    .ws-coming-btn:hover { opacity: .45; }

    /* ── Sidebar footer ─────────────────────────────────────────────── */
    #ws-sidebar-footer {
      padding: 10px 20px;
      border-top: 1px solid var(--border-2);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: .01em;
    }

    /* ── Main content ───────────────────────────────────────────────── */
    #ws-main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #ws-app-container { flex: 1; }

    /* ── Loading / Error states ─────────────────────────────────────── */
    .ws-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 200px;
      gap: 12px;
      color: var(--muted);
      padding: 32px;
      text-align: center;
    }

    .ws-state-icon { font-size: 36px; }
    .ws-state-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .ws-state-msg { font-size: 13px; max-width: 320px; line-height: 1.6; }

    .ws-spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: ds-spin .65s linear infinite;
    }

    /* ── Toast ──────────────────────────────────────────────────────── */
    #ws-toast {
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .ws-toast-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card);
      color: var(--text);
      padding: 12px 16px;
      border-radius: var(--r);
      font-size: 13px; font-weight: 500;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1), 0 0 0 1px var(--border);
      animation: toast-in .2s ease;
      pointer-events: auto;
      border-left: 3px solid var(--border);
      transition: opacity .2s, transform .2s;
    }
    .ws-toast-item.t-success { border-left-color: var(--color-ok); }
    .ws-toast-item.t-error   { border-left-color: var(--color-err); }
    .ws-toast-item.t-warning { border-left-color: var(--color-warn); }
    .ws-toast-item .t-icon   { font-size: 15px; flex-shrink: 0; }
    .ws-toast-item .t-msg    { flex: 1; line-height: 1.4; }

    @keyframes toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

    /* ── Modal ───────────────────────────────────────────────────────── */
    #ws-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      display: none; align-items: center; justify-content: center;
      padding: 20px;
      backdrop-filter: blur(2px);
    }
    #ws-modal-overlay.open { display: flex; animation: ds-modal-fade .15s ease; }
    #ws-modal-box {
      background: var(--card); border-radius: var(--r-xl);
      width: 100%; max-width: 480px; max-height: calc(100vh - 40px);
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.15), 0 0 0 1px var(--border);
      animation: ds-modal-in .2s ease;
    }
    #ws-modal-hd {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border-2);
      display: flex; align-items: center; justify-content: space-between;
    }
    #ws-modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
    #ws-modal-close {
      width: 28px; height: 28px; border: none; background: none; border-radius: var(--r-sm);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); font-size: 20px; line-height: 1; transition: background .1s;
    }
    #ws-modal-close:hover { background: var(--bg); color: var(--text); }
    #ws-modal-body { padding: 20px 24px; }
    #ws-modal-ft {
      padding: 14px 24px; border-top: 1px solid var(--border-2);
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 56px; }
      .ws-nav-name, .ws-nav-label, .ws-nav-badge, .ws-brand-text { display: none; }
      .ws-nav-item { justify-content: center; padding: 10px; }
      #ws-topbar-brand { padding: 0 10px; border-right: none; }
      #ws-breadcrumb { display: none; }
      .ws-coming-grid, #ws-sidebar-footer { display: none; }
    }
  </style>
</head>
<body>

  <header id="ws-topbar">
    <div id="ws-topbar-brand">
      <img id="ws-logo" alt="Logo">
      <div id="ws-brand-text">
        <div id="ws-program-name">AgentHub</div>
        <div id="ws-powered-by">AgentHub Platform</div>
      </div>
    </div>
    <div id="ws-topbar-center">
      <div id="ws-breadcrumb"></div>
    </div>
    <div id="ws-topbar-right">
      <button class="ws-icon-btn" id="ws-notif-btn" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="ws-icon-btn" title="Aide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
      <div id="ws-user-avatar">AG</div>
    </div>
  </header>

  <div id="ws-layout">
    <nav id="ws-sidebar">
      <div id="ws-nav">
        <div class="ws-state" style="min-height:120px">
          <div class="ws-spinner"></div>
        </div>
      </div>
      <div id="ws-sidebar-footer">AgentHub Platform</div>
    </nav>

    <main id="ws-main">
      <div id="ws-app-container">
        <div class="ws-state">
          <div class="ws-spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="ws-toast"></div>

  <!-- Modal partagé -->
  <div id="ws-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div id="ws-modal-box">
      <div id="ws-modal-hd">
        <span id="ws-modal-title"></span>
        <button id="ws-modal-close" aria-label="Fermer">×</button>
      </div>
      <div id="ws-modal-body"></div>
      <div id="ws-modal-ft"></div>
    </div>
  </div>

  <script type="module" src="/static/workspace.js"></script>
</body>
</html>
