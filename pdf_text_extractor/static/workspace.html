<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AgentHub Platform</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/design-system.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* Mica-style background gradient */
    #ws-main {
      background: linear-gradient(160deg, rgba(0,120,212,.02) 0%, var(--bg) 25%);
    }

    /* ── Topbar — Acrylic Fluent ─────────────────────────────────── */
    #ws-topbar {
      height: var(--topbar-h);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(0,0,0,.07);
      display: flex;
      align-items: center;
      padding: 0 12px 0 0;
      gap: 4px;
      flex-shrink: 0;
      z-index: 20;
      position: sticky;
      top: 0;
    }

    #ws-topbar-brand {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 4px;
      border-right: 1px solid rgba(0,0,0,.18);
      height: 100%;
      transition: width .2s ease;
      overflow: hidden;
      background: linear-gradient(160deg, #003570 0%, #004E9A 45%, var(--primary) 100%);
    }

    /* ── Brand section icon/text overrides ─────────────────────────── */
    #ws-topbar-brand .ws-icon-btn { color: rgba(255,255,255,.82); }
    #ws-topbar-brand .ws-icon-btn::before {
      background: radial-gradient(circle at var(--rx,50%) var(--ry,50%),
        rgba(255,255,255,.18) 0%, transparent 70%);
    }
    #ws-topbar-brand .ws-icon-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
    #ws-program-name { color: rgba(255,255,255,.96); }
    #ws-powered-by   { color: rgba(255,255,255,.60); }

    #ws-logo { height: 26px; width: auto; object-fit: contain; display: none; flex-shrink: 0; }

    #ws-brand-text { min-width: 0; overflow: hidden; transition: opacity .15s; }
    #ws-program-name {
      font-size: 13px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #ws-powered-by {
      font-size: 10px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    #ws-topbar-center {
      flex: 1; display: flex; align-items: center; padding: 0 12px; gap: 10px;
    }

    #ws-breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-2);
      min-width: 0; flex-shrink: 1;
    }
    #ws-breadcrumb .bc-sep { color: var(--muted); flex-shrink: 0; }
    #ws-breadcrumb .bc-current { color: var(--text); font-weight: 600; white-space: nowrap; }

    #ws-topbar-spacer { flex: 1; }

    /* Search trigger */
    #ws-search-trigger {
      display: flex; align-items: center; gap: 7px;
      height: 32px; padding: 0 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r); cursor: pointer; color: var(--muted);
      font-size: 12.5px; min-width: 160px; max-width: 260px;
      transition: border-color .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    #ws-search-trigger:hover { border-color: var(--primary); background: var(--card); }
    #ws-search-trigger svg { width: 13px; height: 13px; flex-shrink: 0; }
    .ws-search-placeholder { flex: 1; }
    .ws-search-kbd {
      font-size: 9.5px; background: var(--card); border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px; color: var(--muted);
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── Topbar right ──────────────────────────────────────────────── */
    #ws-topbar-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

    .ws-icon-btn {
      width: 34px; height: 34px; border: none; background: none;
      border-radius: var(--r); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); transition: background var(--transition), color var(--transition);
      flex-shrink: 0; position: relative; overflow: hidden;
    }
    .ws-icon-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at var(--rx, 50%) var(--ry, 50%),
        rgba(0,120,212,.12) 0%, transparent 70%);
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .ws-icon-btn:hover::before { opacity: 1; }
    .ws-icon-btn:hover { background: rgba(0,0,0,.04); color: var(--text); }
    .ws-icon-btn svg { width: 18px; height: 18px; }

    .ws-tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 6px; flex-shrink: 0; }

    /* ── Dropdown wraps ──────────────────────────────────────────── */
    .ws-tb-wrap { position: relative; display: inline-flex; }

    .ws-tb-panel {
      position: absolute; top: calc(100% + 8px); left: 0;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: 0 8px 32px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
      z-index: 400; width: 360px; max-height: 500px;
      overflow: hidden; display: none; flex-direction: column;
    }
    .ws-tb-panel.open { display: flex; animation: ws-panel-in .15s ease; }
    .ws-tb-panel-right { left: auto; right: 0; }
    .ws-tb-panel-sm { width: 280px; }
    .ws-tb-panel-user { width: 230px; }

    @keyframes ws-panel-in {
      from { opacity: 0; transform: translateY(-6px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Notification badge */
    .ws-notif-badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px;
      background: var(--color-err); color: #fff;
      border-radius: var(--r-pill); font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px; pointer-events: none;
    }
    .ws-notif-badge[hidden] { display: none; }

    /* Panel header */
    .ws-panel-hd {
      padding: 12px 16px 10px; border-bottom: 1px solid var(--border-2);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .ws-panel-hd-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .ws-panel-hd-action {
      font-size: 11px; font-weight: 600; color: var(--primary);
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .ws-panel-hd-action:hover { text-decoration: underline; }

    /* Notification list */
    .ws-notif-scroll { overflow-y: auto; flex: 1; }
    .ws-notif-item {
      display: flex; gap: 11px; padding: 10px 16px;
      border-bottom: 1px solid var(--border-2);
      cursor: pointer; transition: background .1s;
    }
    .ws-notif-item:last-child { border-bottom: none; }
    .ws-notif-item:hover { background: var(--bg); }
    .ws-notif-item.unread { background: var(--primary-a10); }
    .ws-notif-ico { font-size: 18px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
    .ws-notif-body { flex: 1; min-width: 0; }
    .ws-notif-title { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws-notif-sub { font-size: 11px; color: var(--text-sub); margin-top: 1px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .ws-notif-time { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .ws-notif-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; margin-top: 5px; }

    .ws-panel-ft {
      padding: 9px 16px; border-top: 1px solid var(--border-2); text-align: center; flex-shrink: 0;
    }
    .ws-panel-ft button, .ws-panel-ft a {
      font-size: 12px; font-weight: 600; color: var(--primary);
      background: none; border: none; cursor: pointer; text-decoration: none;
    }
    .ws-panel-ft button:hover, .ws-panel-ft a:hover { text-decoration: underline; }

    /* Menu lists (help, settings, user) */
    .ws-menu-list { padding: 6px; overflow-y: auto; flex: 1; }
    .ws-menu-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: var(--r); cursor: pointer; color: var(--text-2);
      font-size: 12.5px; font-weight: 500; transition: background .1s, color .1s;
      text-decoration: none; border: none; background: none; width: 100%; text-align: left;
      font-family: var(--font);
    }
    .ws-menu-item:hover { background: var(--bg); color: var(--text); }
    .ws-menu-item.danger:hover { background: var(--color-err-soft); color: var(--color-err-text); }
    .ws-menu-item-icon {
      width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--bg-2);
      display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
    }
    .ws-menu-item-body { flex: 1; min-width: 0; }
    .ws-menu-item-title { font-size: 12.5px; font-weight: 600; color: inherit; display: block; }
    .ws-menu-item-desc { font-size: 10.5px; color: var(--muted); display: block; }
    .ws-menu-divider { height: 1px; background: var(--border-2); margin: 4px 8px; }
    .ws-menu-section { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px 4px; }

    /* Version tag */
    .ws-version-tag { padding: 6px 16px 10px; text-align: center; font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--border-2); flex-shrink: 0; }

    /* User trigger */
    .ws-user-trigger {
      display: flex; align-items: center; gap: 7px; padding: 3px 6px 3px 3px;
      background: none; border: 1px solid transparent; border-radius: var(--r);
      cursor: pointer; height: 40px; transition: background .12s, border-color .12s;
      font-family: var(--font);
    }
    .ws-user-trigger:hover { background: var(--bg); border-color: var(--border); }
    .ws-user-trigger[aria-expanded="true"] { background: var(--bg); border-color: var(--border); }
    #ws-user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--primary-lt); color: var(--primary-dk);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #ws-user-info { display: flex; flex-direction: column; align-items: flex-start; }
    #ws-user-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; line-height: 1.3; }
    #ws-user-org  { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .ws-chevron { color: var(--muted); transition: transform .2s; flex-shrink: 0; }
    .ws-user-trigger[aria-expanded="true"] .ws-chevron { transform: rotate(180deg); }

    /* User panel header */
    .ws-upanel-hd { padding: 12px 16px 10px; border-bottom: 1px solid var(--border-2); flex-shrink: 0; }
    .ws-upanel-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
    .ws-upanel-email { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .ws-upanel-role {
      display: inline-flex; align-items: center; margin-top: 6px;
      font-size: 10.5px; font-weight: 600; padding: 2px 8px;
      border-radius: var(--r-pill); background: var(--primary-lt); color: var(--primary-dk);
    }

    /* ── Sidebar collapse ─────────────────────────────────────────── */
    #ws-sidebar { transition: width .2s ease; }

    body.sidebar-collapsed { --sidebar-w: 56px; }
    body.sidebar-collapsed #ws-topbar-brand { padding: 0 6px; }
    body.sidebar-collapsed #ws-brand-text,
    body.sidebar-collapsed .ws-nav-name,
    body.sidebar-collapsed .ws-nav-label,
    body.sidebar-collapsed .ws-nav-badge,
    body.sidebar-collapsed #ws-sidebar-footer .ws-demo-row,
    body.sidebar-collapsed .ws-collapse-text { display: none; }
    body.sidebar-collapsed .ws-nav-item { justify-content: center; padding: 8px; }
    body.sidebar-collapsed .ws-collapse-btn { justify-content: center; }
    body.sidebar-collapsed .ws-collapse-btn svg { transform: rotate(180deg); }

    /* ── Layout ───────────────────────────────────────────────────── */
    #ws-layout { display: flex; flex: 1; overflow: hidden; }

    #ws-sidebar {
      width: var(--sidebar-w);
      background: rgba(249,249,249,.96);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-right: 1px solid rgba(0,0,0,.06);
      display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }
    #ws-nav { flex: 1; overflow-y: auto; overflow-x: hidden; }

    .ws-nav-section { padding: 16px 10px 4px; }
    .ws-nav-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); padding: 0 8px; margin-bottom: 2px;
    }
    .ws-nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px;
      border: none; background: none; border-radius: var(--r);
      cursor: pointer; text-align: left;
      transition: background var(--transition), color var(--transition);
      color: var(--text-sub); font-size: 13px; font-weight: 400;
      position: relative;
      font-family: var(--font);
      /* Reveal effect */
      overflow: hidden;
    }
    .ws-nav-item::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at var(--rx, 50%) var(--ry, 50%),
        rgba(0,120,212,.10) 0%, transparent 60%);
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .ws-nav-item:hover:not(:disabled)::before { opacity: 1; }
    .ws-nav-item:hover:not(:disabled) { color: var(--text); background: rgba(0,0,0,.03); }
    .ws-nav-item.active {
      background: var(--primary-a10); color: var(--primary);
      font-weight: 600;
    }
    .ws-nav-item.active::after {
      content: '';
      position: absolute; left: 0; top: 20%; height: 60%; width: 3px;
      background: var(--primary); border-radius: 0 2px 2px 0;
    }
    .ws-nav-item.active .ws-nav-icon svg { stroke: var(--primary); }
    .ws-nav-item.soon { opacity: .55; }

    .ws-nav-icon { flex-shrink: 0; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .ws-nav-icon svg { width: 16px; height: 16px; }
    .ws-nav-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws-nav-badge { font-size: 9.5px; font-weight: 600; border-radius: 4px; padding: 2px 5px; flex-shrink: 0; }
    .ws-badge-soon { background: var(--bg-2); color: var(--muted); }
    .ws-badge-new  { background: var(--color-ok-bg); color: var(--color-ok-text); }

    .ws-sidebar-divider { height: 1px; background: var(--border); margin: 6px 12px; }

    /* Sidebar footer */
    #ws-sidebar-footer {
      padding: 8px 10px 6px; border-top: 1px solid var(--border-2); flex-shrink: 0;
    }
    .ws-demo-row {
      display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 8px;
    }
    .ws-demo-label { font-size: 12px; color: var(--text-sub); font-weight: 500; }
    .ws-demo-switch {
      width: 30px; height: 17px; border-radius: 9px;
      background: var(--muted); border: none; padding: 0; cursor: pointer;
      position: relative; transition: background .2s; flex-shrink: 0;
    }
    .ws-demo-switch.on { background: var(--primary); }
    .ws-demo-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .2s;
    }
    .ws-demo-switch.on::after { transform: translateX(13px); }
    .ws-collapse-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      border: none; background: none; border-radius: var(--r); cursor: pointer;
      width: 100%; color: var(--muted); font-size: 12px; font-family: var(--font);
      transition: background .1s, color .1s;
    }
    .ws-collapse-btn:hover { background: var(--bg-2); color: var(--text-2); }
    .ws-collapse-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── Main ─────────────────────────────────────────────────────── */
    #ws-main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
    #ws-app-container { flex: 1; }

    /* ── States ───────────────────────────────────────────────────── */
    .ws-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; min-height: 200px; gap: 12px; color: var(--muted); padding: 32px; text-align: center;
    }
    .ws-spinner {
      width: 28px; height: 28px; border: 2.5px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%; animation: ds-spin .65s linear infinite;
    }

    /* ── Toast ────────────────────────────────────────────────────── */
    #ws-toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 500;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none;
    }
    .ws-toast-item {
      display: flex; align-items: center; gap: 10px; background: var(--card); color: var(--text);
      padding: 12px 16px; border-radius: var(--r); font-size: 13px; font-weight: 500; max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1), 0 0 0 1px var(--border);
      animation: toast-in .2s ease; pointer-events: auto;
      border-left: 3px solid var(--border); transition: opacity .2s, transform .2s;
    }
    .ws-toast-item.t-success { border-left-color: var(--color-ok); }
    .ws-toast-item.t-error   { border-left-color: var(--color-err); }
    .ws-toast-item.t-warning { border-left-color: var(--color-warn); }
    .ws-toast-item .t-icon   { font-size: 15px; flex-shrink: 0; }
    .ws-toast-item .t-msg    { flex: 1; line-height: 1.4; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

    /* ── Modal ────────────────────────────────────────────────────── */
    #ws-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 600;
      display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px);
    }
    #ws-modal-overlay.open { display: flex; animation: ds-modal-fade .15s ease; }
    #ws-modal-box {
      background: var(--card); border-radius: var(--r-xl); width: 100%; max-width: 480px;
      max-height: calc(100vh - 40px); overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.15), 0 0 0 1px var(--border); animation: ds-modal-in .2s ease;
    }
    #ws-modal-hd {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border-2);
      display: flex; align-items: center; justify-content: space-between;
    }
    #ws-modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
    #ws-modal-close {
      width: 28px; height: 28px; border: none; background: none; border-radius: var(--r-sm);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); font-size: 20px; line-height: 1; transition: background .1s;
    }
    #ws-modal-close:hover { background: var(--bg); color: var(--text); }
    #ws-modal-body { padding: 20px 24px; }
    #ws-modal-ft { padding: 14px 24px; border-top: 1px solid var(--border-2); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    /* ── Search overlay (command palette) ─────────────────────────── */
    #ws-search-overlay {
      position: fixed; inset: 0; z-index: 700;
      background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
      display: none; align-items: flex-start; justify-content: center; padding: 80px 16px 16px;
    }
    #ws-search-overlay.open { display: flex; animation: ds-modal-fade .15s ease; }
    #ws-search-box {
      width: 100%; max-width: 560px; background: var(--card); border-radius: var(--r-xl);
      box-shadow: 0 20px 60px rgba(0,0,0,.2), 0 0 0 1px var(--border);
      max-height: calc(100vh - 120px); display: flex; flex-direction: column;
      animation: ds-modal-in .18s ease;
    }
    .ws-search-iw {
      display: flex; align-items: center; gap: 10px; padding: 0 16px;
      border-bottom: 1px solid var(--border-2); flex-shrink: 0;
    }
    .ws-search-iw svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
    #ws-search-input {
      flex: 1; border: none; outline: none; font-size: 15px; font-family: var(--font);
      color: var(--text); background: transparent; padding: 15px 0;
    }
    #ws-search-input::placeholder { color: var(--muted); }
    .ws-search-esc {
      font-size: 10px; font-family: var(--font); background: var(--bg);
      border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; color: var(--muted); cursor: pointer;
    }
    #ws-search-results { overflow-y: auto; flex: 1; }
    .ws-sr-section { padding: 6px 0 4px; }
    .ws-sr-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 4px 16px; }
    .ws-sr-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 16px;
      cursor: pointer; border: none; background: none; width: 100%; text-align: left;
      transition: background .1s; font-family: var(--font);
    }
    .ws-sr-item:hover, .ws-sr-item.focused { background: var(--primary-a10); }
    .ws-sr-icon { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--bg-2); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .ws-sr-title { font-size: 13px; font-weight: 500; color: var(--text); display: block; }
    .ws-sr-sub   { font-size: 11px; color: var(--muted); display: block; }
    .ws-search-footer-bar {
      padding: 8px 16px; border-top: 1px solid var(--border-2);
      display: flex; gap: 16px; font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    .ws-search-footer-bar kbd {
      background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
      padding: 1px 5px; font-size: 10px;
    }

    /* ── Responsive ───────────────────────────────────────────────── */
    @media (max-width: 768px) {

      #ws-search-trigger { min-width: 34px; width: 34px; justify-content: center; padding: 0; }
      #ws-user-info { display: none; }
      .ws-chevron { display: none; }
      .ws-user-trigger { padding: 3px; }
      .ws-tb-sep { display: none; }
      #ws-sidebar-footer .ws-demo-row { display: none; }
      .ws-collapse-text { display: none; }
      .ws-collapse-btn { justify-content: center; }
    }
  </style>
</head>

  <script type="module" src="/static/workspace.js"></script>
  <script>
    /* ── Fluent Reveal — halo lumineux sur tous les boutons ─────── */
    function _initReveal() {
      document.querySelectorAll('.ds-btn, .ws-icon-btn, .ws-nav-item, .ws-user-trigger').forEach(el => {
        el.addEventListener('mousemove', e => {
          const r = el.getBoundingClientRect();
          el.style.setProperty('--rx', ((e.clientX - r.left) / r.width  * 100).toFixed(1) + '%');
          el.style.setProperty('--ry', ((e.clientY - r.top)  / r.height * 100).toFixed(1) + '%');
        });
      });
    }
    /* Observer pour capturer les éléments montés dynamiquement */
    const _revealObs = new MutationObserver(_initReveal);
    _revealObs.observe(document.getElementById('ws-nav'), { childList: true, subtree: true });
    _initReveal();

    /* ── Fluent Reveal sur les cartes de contenu (apps) ─────────── */
    document.getElementById('ws-app-container').addEventListener('mousemove', e => {
      document.querySelectorAll('.ds-reveal').forEach(card => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--rx', ((e.clientX - r.left) / r.width  * 100).toFixed(1) + '%');
        card.style.setProperty('--ry', ((e.clientY - r.top)  / r.height * 100).toFixed(1) + '%');
      });
    });
  </script>
