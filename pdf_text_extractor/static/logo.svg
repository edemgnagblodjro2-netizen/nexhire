<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Icon : hexagone + nœuds connectés -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#g2)" stroke="url(#g1)" stroke-width="2"/>

  <!-- Nœud central -->
  <circle cx="32" cy="32" r="5" fill="url(#g1)"/>

  <!-- 3 nœuds satellites -->
  <circle cx="32" cy="16" r="3" fill="#818CF8" opacity=".85"/>
  <circle cx="44" cy="40" r="3" fill="#818CF8" opacity=".85"/>
  <circle cx="20" cy="40" r="3" fill="#818CF8" opacity=".85"/>

  <!-- Lignes de connexion -->
  <line x1="32" y1="27" x2="32" y2="19" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="35" x2="41" y2="38" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="35" x2="23" y2="38" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wordmark : Nex -->
  <text x="70" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="800" font-size="28" fill="#1e293b" letter-spacing="-0.5">Nex</text>

  <!-- Wordmark : hire -->
  <text x="113" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="800" font-size="28" fill="url(#g1)" letter-spacing="-0.5">hire</text>

  <!-- Badge EIP -->
  <rect x="162" y="28" width="36" height="16" rx="4" fill="url(#g1)" opacity=".15"/>
  <text x="180" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="700" font-size="10" fill="#6366F1" text-anchor="middle" letter-spacing="1">EIP</text>

  <!-- Tagline -->
  <text x="71" y="56" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="400" font-size="9" fill="#94a3b8" letter-spacing="0.5">by CivicAI Inc.</text>
</svg>
