name: CI/CD — AgentHub Platform

# ── Déclencheurs ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les workflows obsolètes sur la même branche/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Variables globales ────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Lint (ruff + black)
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-lint-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install lint tools
        run: pip install ruff black

      - name: ruff
        run: ruff check . --output-format=github

      - name: black
        run: black --check --diff .


# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Tests + couverture
# ══════════════════════════════════════════════════════════════════════════════
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost/test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_JWT_SECRET: ci-test-secret-key-for-hs256
      ALLOW_HS256_FALLBACK: "true"
      ENVIRONMENT: test
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-test-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage XML (pour intégration future Codecov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.run_number }}
          path: coverage.xml
          retention-days: 14


# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — Build Docker (seulement sur main après lint + test réussis)
# ══════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}


# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — Déploiement staging (Render, seulement après build réussi)
# ══════════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://agenthub-staging.onrender.com
    steps:
      - name: Trigger Render deploy
        run: |
          curl --silent --show-error --fail \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for staging to be healthy
        run: |
          echo "Attente du démarrage Render (60s)..."
          sleep 60
          for i in $(seq 1 10); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              https://agenthub-staging.onrender.com/health || echo "000")
            echo "Tentative $i/10 — /health → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Staging opérationnel."
              exit 0
            fi
            sleep 15
          done
          echo "Staging n'a pas répondu dans les délais."
          exit 1
