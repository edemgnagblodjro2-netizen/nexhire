<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extracteur de texte PDF</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Application Python</p>
        <h1>Extraire le texte d'un PDF</h1>
        <p class="intro">
          Televersez un fichier PDF pour recuperer son contenu texte en quelques
          secondes.
        </p>

        <form class="upload-form" method="post" enctype="multipart/form-data">
          <label class="file-picker" for="pdf_file">
            <span>Choisir un fichier PDF</span>
            <input id="pdf_file" name="pdf_file" type="file" accept=".pdf" />
          </label>
          <button type="submit">Televerser et extraire</button>
        </form>

        {% if error %}
          <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        {% if warning %}
          <div class="alert alert-warning" role="status">{{ warning }}</div>
        {% endif %}

        {% if filename %}
          <section class="result">
            <div class="result-header">
              <h2>Texte extrait</h2>
              <span>{{ filename }}</span>
            </div>
            <textarea readonly rows="14" aria-label="Texte extrait du PDF">{{ extracted_text }}</textarea>
          </section>
        {% endif %}
      </section>
    </main>
  </body>
</html>
