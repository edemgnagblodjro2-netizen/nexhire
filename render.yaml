services:
  - type: static
    name: civicai-myportal
    buildCommand: mkdir -p portal_dist && cp pdf_text_extractor/static/myportal.html portal_dist/index.html
    staticPublishPath: ./portal_dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0

  - type: web
    name: civicai-agenthub
    runtime: python
    rootDir: pdf_text_extractor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FERNET_KEYS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: M365_CLIENT_ID
        sync: false
      - key: M365_CLIENT_SECRET
        sync: false
      - key: M365_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
